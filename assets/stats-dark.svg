<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" role="img" aria-label="GitHub stats">
<style>.t{font:600 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#e6edf3}.k{font:400 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#8b949e}.v{font:700 14px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#e6edf3}</style>
<rect x=".5" y=".5" width="439" height="209" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="24" y="38" class="t">GitHub at a glance</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.30s" dur=".4s" fill="freeze"/><circle cx="30" cy="67" r="4" fill="#2f81f7"/><text x="44" y="72" class="k">Public repos</text><text x="412" y="72" text-anchor="end" class="v">13</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.45s" dur=".4s" fill="freeze"/><circle cx="30" cy="94" r="4" fill="#2f81f7"/><text x="44" y="99" class="k">Stars earned</text><text x="412" y="99" text-anchor="end" class="v">0</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.60s" dur=".4s" fill="freeze"/><circle cx="30" cy="121" r="4" fill="#2f81f7"/><text x="44" y="126" class="k">Forks</text><text x="412" y="126" text-anchor="end" class="v">0</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.75s" dur=".4s" fill="freeze"/><circle cx="30" cy="148" r="4" fill="#2f81f7"/><text x="44" y="153" class="k">Followers</text><text x="412" y="153" text-anchor="end" class="v">1</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.90s" dur=".4s" fill="freeze"/><circle cx="30" cy="175" r="4" fill="#2f81f7"/><text x="44" y="180" class="k">On GitHub since</text><text x="412" y="180" text-anchor="end" class="v">2023</text></g>
</svg>