<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Ayush Gupta: Full-Stack Engineer · AI Systems Builder">
<defs>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1f2328" stroke-opacity="0.08"/></pattern>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#0969da"/><stop offset=".5" stop-color="#8250df"/><stop offset="1" stop-color="#0969da"/>
    <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="card"><rect width="900" height="270" rx="16"/></clipPath>
</defs>
<style>
  .orb{transform-box:fill-box;transform-origin:center}
  .name{font:700 48px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#1f2328;opacity:0;animation:up .9s ease-out .1s forwards}
  .role{font:600 21px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;opacity:0;animation:up .9s ease-out .45s forwards}
  .school{font:400 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#656d76;opacity:0;animation:up .9s ease-out .75s forwards}
  .tags{opacity:0;animation:up .9s ease-out 1.05s forwards}
  .tag{font:500 12px 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#656d76}
  .pill{opacity:0;animation:up .9s ease-out 1.35s forwards}
  .status{font:600 12.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#1a7f37}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
  @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
</style>
<g clip-path="url(#card)">
  <rect width="900" height="270" fill="#ffffff"/>
  <circle class="orb o0" cx="120" cy="60" r="130" fill="#0969da" opacity="0.22" filter="url(#blur)"/><style>.o0{animation:drift0 14s ease-in-out infinite alternate}@keyframes drift0{to{transform:translate(60px,30px)}}</style><circle class="orb o1" cx="780" cy="210" r="150" fill="#8250df" opacity="0.22" filter="url(#blur)"/><style>.o1{animation:drift1 17s ease-in-out infinite alternate}@keyframes drift1{to{transform:translate(-70px,-25px)}}</style><circle class="orb o2" cx="520" cy="-20" r="110" fill="#1a7f37" opacity="0.22" filter="url(#blur)"/><style>.o2{animation:drift2 19s ease-in-out infinite alternate}@keyframes drift2{to{transform:translate(-40px,40px)}}</style>
  <rect width="900" height="270" fill="url(#grid)"/>
</g>
<rect x=".5" y=".5" width="899" height="269" rx="16" fill="none" stroke="#d0d7de"/>
<text x="450.0" y="92" text-anchor="middle" class="name">Ayush Gupta</text>
<text x="450.0" y="128" text-anchor="middle" class="role" fill="url(#g)">Full-Stack Engineer · AI Systems Builder</text>
<text x="450.0" y="156" text-anchor="middle" class="school">B.Tech CSE @ BML Munjal University · Class of 2027</text>
<g class="tags"><g transform="translate(227,176)"><g transform="translate(0,0)"><rect width="89" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="44" y="16.5" text-anchor="middle" class="tag">Graph RAG</text></g><g transform="translate(96.60000000000001,0)"><rect width="133" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="66" y="16.5" text-anchor="middle" class="tag">Computer Vision</text></g><g transform="translate(237.60000000000002,0)"><rect width="74" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="37" y="16.5" text-anchor="middle" class="tag">FastAPI</text></g><g transform="translate(319.40000000000003,0)"><rect width="52" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="26" y="16.5" text-anchor="middle" class="tag">MERN</text></g><g transform="translate(379.00000000000006,0)"><rect width="66" height="24" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="33" y="16.5" text-anchor="middle" class="tag">Docker</text></g></g></g>
<g transform="translate(260,218)"><g class="pill">
  <rect width="380" height="28" rx="14" fill="#1a7f37" fill-opacity=".12" stroke="#1a7f37" stroke-opacity=".5"/>
  <circle class="pulse" cx="18" cy="14" r="4" fill="#1a7f37"/><circle cx="18" cy="14" r="4" fill="#1a7f37"/>
  <text x="32" y="18.5" class="status">Open to SDE / Full-Stack / AI Engineering roles</text>
</g></g>
</svg>