name: Update profile README

on:
  push:
    paths:
      - "README.template.md"
      - ".github/scripts/**"
      - ".github/workflows/update-readme.yml"
  schedule:
    - cron: "30 0 * * *"   # every day at 06:00 IST
  workflow_dispatch:        # run manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build README + animated SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          LINKEDIN_URL: ${{ vars.LINKEDIN_URL }}
        run: python .github/scripts/build_readme.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#0969da
            assets/snake-dark.svg?palette=github-dark&color_snake=#2f81f7

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --staged --quiet || (git commit -m "chore: refresh profile README" && git push)
